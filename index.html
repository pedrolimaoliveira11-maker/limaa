<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mini Minecraft 2D</title>
  <style>
    body { background-color:#87CEEB; font-family:Arial; text-align:center; }
    #game {
      position:relative; width:800px; height:500px;
      margin:20px auto; background-color:#a3d9a5;
      border:2px solid #333; overflow:hidden;
    }
    .block {
      position:absolute; width:40px; height:40px;
      border:1px solid #000; background-size:cover;
    }
    .stone { background-image:url("sprites/stone.png"); }
    .grass { background-image:url("sprites/grass.png"); }
    .wood { background-image:url("sprites/wood.png"); }
    #player {
      position:absolute; width:30px; height:30px;
      background-image:url("sprites/player.png");
      background-size:cover; bottom:40px; left:100px;
    }
    .enemy {
      position:absolute; width:30px; height:30px;
      background-image:url("sprites/enemy.png");
      background-size:cover;
    }
    #inventory { margin:10px; }
    .item {
      display:inline-block; width:40px; height:40px;
      border:2px solid #000; margin:5px; cursor:pointer;
      background-size:cover;
    }
    .item[data-type="grass"] { background-image:url("sprites/grass.png"); }
    .item[data-type="stone"] { background-image:url("sprites/stone.png"); }
    .item[data-type="wood"] { background-image:url("sprites/wood.png"); }
    .selected { border:3px solid yellow; }
    #healthBar {
      width:200px; height:20px; border:2px solid #000;
      margin:10px auto; background-color:#ccc;
    }
    #health { width:100%; height:100%; background-color:green; }
    #hud { margin:10px; font-size:18px; }
    #crafting {
      margin:10px; padding:10px; border:2px solid #000;
      display:none; background-color:#eee;
    }
  </style>
</head>
<body>
  <h1>Mini Minecraft 2D</h1>
  <p>Setas = mover | Espaço = pular | Clique = bloco | E = quebrar | C = crafting</p>
  
  <div id="healthBar"><div id="health"></div></div>
  <div id="hud">Pontuação: <span id="score">0</span> | Nível: <span id="level">1</span></div>
  
  <div id="inventory">
    <div class="item grass selected" data-type="grass"></div>
    <div class="item stone" data-type="stone"></div>
    <div class="item wood" data-type="wood"></div>
  </div>
  
  <div id="crafting">
    <h3>Crafting</h3>
    <p>2 madeiras → 1 tábua</p>
    <p>2 pedras → 1 tijolo</p>
  </div>
  
  <div id="game"><div id="player"></div></div>

  <audio id="hitSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
  <audio id="breakSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_break.ogg"></audio>
  <audio id="bgMusic" src="https://actions.google.com/sounds/v1/ambiences/forest_ambience.ogg" loop></audio>

  <script>
    const game=document.getElementById("game"),player=document.getElementById("player"),
          inventoryItems=document.querySelectorAll(".item"),
          healthBar=document.getElementById("health"),
          scoreDisplay=document.getElementById("score"),
          levelDisplay=document.getElementById("level"),
          hitSound=document.getElementById("hitSound"),
          breakSound=document.getElementById("breakSound"),
          bgMusic=document.getElementById("bgMusic"),
          craftingMenu=document.getElementById("crafting");

    let playerX=100,playerY=430,velocityY=0,gravity=2,isJumping=false,
        moveLeft=false,moveRight=false,selectedBlock="grass",
        health=100,score=0,level=1;

    bgMusic.play();

    inventoryItems.forEach(item=>{
      item.addEventListener("click",()=>{
        inventoryItems.forEach(i=>i.classList.remove("selected"));
        item.classList.add("selected");
        selectedBlock=item.dataset.type;
      });
    });

    document.addEventListener("keydown",e=>{
      if(e.key==="ArrowRight") moveRight=true;
      if(e.key==="ArrowLeft") moveLeft=true;
      if(e.key===" "&&!isJumping){velocityY=-20;isJumping=true;}
      if(e.key==="e"||e.key==="E") breakBlock();
      if(e.key==="c"||e.key==="C") craftingMenu.style.display=
        craftingMenu.style.display==="none"?"block":"none";
    });
    document.addEventListener("keyup",e=>{
      if(e.key==="ArrowRight") moveRight=false;
      if(e.key==="ArrowLeft") moveLeft=false;
    });

    function updatePlayer(){player.style.left=playerX+"px";player.style.top=playerY+"px";}

    function checkCollision(){
      const blocks=document.querySelectorAll(".block"),playerRect=player.getBoundingClientRect();
      blocks.forEach(block=>{
        const blockRect=block.getBoundingClientRect();
        if(playerRect.bottom>=blockRect.top&&playerRect.top<blockRect.top&&
           playerRect.right>blockRect.left&&playerRect.left<blockRect.right){
          playerY=block.offsetTop-player.offsetHeight;velocityY=0;isJumping=false;
        }
        if(playerRect.left<=blockRect.right&&playerRect.right>blockRect.right&&
           playerRect.bottom>blockRect.top&&playerRect.top<blockRect.bottom){
          playerX=block.offsetLeft+block.offsetWidth;
        }
        if(playerRect.right>=blockRect.left&&playerRect.left<blockRect.left&&
           playerRect.bottom>blockRect.top&&playerRect.top<blockRect.bottom){
          playerX=block.offsetLeft-player.offsetWidth;
        }
      });
    }

    function breakBlock(){
      const blocks=document.querySelectorAll(".block"),playerRect=player.getBoundingClientRect();
      blocks.forEach(block=>{
        const blockRect=block.getBoundingClientRect();
        if(playerRect.right>blockRect.left&&playerRect.left<blockRect.right&&
           playerRect.bottom>blockRect.top&&playerRect.top<blockRect.bottom){
          breakSound.play();score+=10;scoreDisplay.textContent=score;
          if(score%50===0){level++;levelDisplay.textContent=level;}
          block.remove();
        }
      });
    }

    function damagePlayer(amount){
      health-=amount;if(health<0)health=0;
      healthBar.style.width=health*2+"px";hitSound.play();
      if(health===0){alert("Game Over! Respawnando...");respawn();}
    }

    function checkEnemyCollision(){
      const enemies=document.querySelectorAll(".enemy"),playerRect=player.getBoundingClientRect();
      enemies.forEach(enemy=>{
        const enemyRect=enemy.getBoundingClientRect();
        if(playerRect.right>enemyRect.left&&playerRect.left<enemyRect.right&&
           playerRect.bottom>enemyRect.top&&playerRect.top<enemyRect.bottom){
          damagePlayer(10);
        }
      });
    }

    function respawn(){
      health=100;healthBar.style.width="200px";
      playerX=100;playerY=430;score=0;level=1;
      scoreDisplay.textContent=score;levelDisplay.textContent=level;
    }

    function gameLoop(){
      if(moveRight)playerX+=5;if(moveLeft)playerX-=5;
      velocityY+=gravity;playerY+=velocityY;
      if(playerY>=430){playerY=430;velocityY=0;isJumping=false;}
      checkCollision();checkEnemyCollision();updatePlayer();moveEnemies();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    game.addEventListener("click",e=>{
      const block=document.createElement("div");block.classList.add("block",selectedBlock);
      const rect=game.getBoundingClientRect();
      block.style.left=Math.floor((e.clientX-rect.left)/40)*40+"px";
      block.style.top=Math.floor((e.clientY-rect.top)/40)*40+"px";
      game.appendChild(block);
    });

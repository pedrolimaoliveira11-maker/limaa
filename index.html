<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Virtual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #00d9ff;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        .info-box {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            text-align: center;
            min-width: 120px;
        }

        .info-item .label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00d9ff;
        }

        .botoes {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        button {
            padding: 13px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-estacionar {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }

        .btn-estacionar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
        }

        .btn-liberar {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: #fff;
        }

        .btn-liberar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(214, 48, 49, 0.4);
        }

        .btn-limpar {
            background: #636e72;
            color: #fff;
        }

        .btn-limpar:hover {
            background: #2d3436;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: rgba(0, 217, 255, 0.2);
            padding: 14px 10px;
            text-align: left;
            color: #00d9ff;
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .vaga-ocupada {
            color: #ff7675;
            font-weight: bold;
        }

        .veiculo-nome {
            color: #74b9ff;
            font-weight: 500;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .alerta {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .alerta.sucesso {
            background: rgba(0, 184, 148, hid: 0.2);
            border: 1px solid #00b894;
            color: #00b894;
        }

        .alerta.erro {
            background: rgba(214, 48, 49, 0.2);
            border: 1px solid #d63031;
            color: #ff7675;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 0.8rem;
        }

        @media (max-width: 700px) {
            table {
                font-size: 0.8rem;
            }
            th, td {
                padding: 10px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🅿️ Estacionamento Virtual</h1>
        <p class="subtitle">Simulador com nome dos veículos • Gera GR e CPF • Controla vagas</p>

        <div id="alerta" class="alerta"></div>

        <div class="info-box">
            <div class="info-item">
                <div class="label">Total de Vagas</div>
                <div class="value" id="totalVagas">20</div>
            </div>
            <div class="info-item">
                <div class="label">Vagas Ocupadas</div>
                <div class="value" id="ocupadas">0</div>
            </div>
            <div class="info-item">
                <div class="label">Vagas Sobrando</div>
                <div class="value" id="sobrando">20</div>
            </div>
        </div>

        <div class="botoes">
            <button class="btn-estacionar" onclick="estacionarVeiculo()">🚗 Estacionar Veículo</button>
            <button class="btn-liberar" onclick="liberarUltimo()">🔓 Liberar Último</button>
            <button class="btn-limpar" onclick="limparTudo()">🗑️ Limpar Tudo</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Vaga</th>
                    <th>Veículo</th>
                    <th>GR (Registro)</th>
                    <th>CPF</th>
                    <th>Horário</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaVeiculos">
                <tr>
                    <td colspan="6" class="empty">Nenhum veículo estacionado</td>
                </tr>
            </tbody>
        </table>

        <footer>
            Simulação apenas • CPFs, GRs e veículos são fictícios
        </footer>
    </div>

    <script>
        const TOTAL_VAGAS = 20;
        let veiculos = [];

        // Lista de veículos populares no Brasil
        const modelos = [
            "Volkswagen Gol",
            "Chevrolet Onix",
            "Hyundai HB20",
            "Fiat Argo",
            "Volkswagen Polo",
            "Chevrolet Tracker",
            "Hyundai Creta",
            "Jeep Compass",
            "Toyota Corolla",
            "Honda Civic",
            "Fiat Strada",
            "Volkswagen T-Cross",
            "Renault Kwid",
            "Fiat Mobi",
            "Chevrolet Spin",
            "Toyota Hilux",
            "Ford Ranger",
            "Nissan Kicks",
            "Peugeot 208",
            "Citroën C3",
            "Volkswagen Virtus",
            "Honda HR-V",
            "Jeep Renegade",
            "Fiat Toro",
            "Chevrolet S10"
        ];

        // Gera um CPF válido (simulação)
        function gerarCPF() {
            function calcDigito(base) {
                let soma = 0;
                for (let i = 0; i < base.length; i++) {
                    soma += parseInt(base[i]) * (base.length + 1 - i);
                }
                let resto = (soma * 10) % 11;
                return resto === 10 ? 0 : resto;
            }

            let n = '';
            for (let i = 0; i < 9; i++) {
                n += Math.floor(Math.random() * 10);
            }

            const d1 = calcDigito(n);
            const d2 = calcDigito(n + d1);
            const cpf = n + d1 + d2;
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        }

        // Gera código GR
        function gerarGR() {
            const num = Math.floor(Math.random() * 90000000) + 10000000;
            return 'GR-' + num;
        }

        // Escolhe um veículo aleatório
        function gerarVeiculo() {
            const indice = Math.floor(Math.random() * modelos.length);
            return modelos[indice];
        }

        function atualizarPainel() {
            document.getElementById('ocupadas').textContent = veiculos.length;
            document.getElementById('sobrando').textContent = TOTAL_VAGAS - veiculos.length;
        }

        function mostrarAlerta(msg, tipo) {
            const el = document.getElementById('alerta');
            el.textContent = msg;
            el.className = 'alerta ' + tipo;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 3000);
        }

        function atualizarTabela() {
            const tbody = document.getElementById('listaVeiculos');

            if (veiculos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">Nenhum veículo estacionado</td></tr>';
                return;
            }

            tbody.innerHTML = veiculos.map((v, index) => `
                <tr>
                    <td class="vaga-ocupada">Vaga ${v.vaga}</td>
                    <td class="veiculo-nome">${v.modelo}</td>
                    <td>${v.gr}</td>
                    <td>${v.cpf}</td>
                    <td>${v.horario}</td>
                    <td>
                        <button class="btn-liberar" style="padding:6px 12px; font-size:0.82rem;" 
                                onclick="liberarVaga(${index})">
                            Liberar
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function estacionarVeiculo() {
            if (veiculos.length >= TOTAL_VAGAS) {
                mostrarAlerta('🚫 Estacionamento lotado! Não há vagas sobrando.', 'erro');
                return;
            }

            // Encontra a próxima vaga livre
            const vagasUsadas = veiculos.map(v => v.vaga);
            let novaVaga = 1;
            while (vagasUsadas.includes(novaVaga)) {
                novaVaga++;
            }

            const agora = new Date();
            const horario = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const novo = {
                vaga: novaVaga,
                modelo: gerarVeiculo(),
                gr: gerarGR(),
                cpf: gerarCPF(),
                horario: horario
            };

            veiculos.push(novo);
            veiculos.sort((a, b) => a.vaga - b.vaga);

            atualizarPainel();
            atualizarTabela();
            mostrarAlerta(`✅ ${novo.modelo} estacionado na Vaga ${novaVaga}`, 'sucesso');
        }

        function liberarVaga(index) {
            const liberado = veiculos.splice(index, 1)[0];
            atualizarPainel();
            atualizarTabela();
            mostrarAlerta(`🔓 ${liberado.modelo} saiu da Vaga ${liberado.vaga}`, 'sucesso');
        }

        function liberarUltimo() {
            if (veiculos.length === 0) {
                mostrarAlerta('Não há veículos para liberar.', 'erro');
                return;
            }
            liberarVaga(veiculos.length - 1);
        }

        function limparTudo() {
            if (veiculos.length === 0) return;
            if (confirm('Tem certeza que deseja liberar todas as vagas?')) {
                veiculos = [];
                atualizarPainel();
                atualizarTabela();
                mostrarAlerta('Todas as vagas foram liberadas.', 'sucesso');
            }
        }

        // Inicializa
        atualizarPainel();
    </script>
</body>
</html>

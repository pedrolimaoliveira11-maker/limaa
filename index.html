<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Guerra 2D</title>
  <style>
    body { margin: 0; background: #eee; }
    canvas { display: block; margin: auto; background: #fff; border: 2px solid #000; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameOver = false;
    let winner = "";

    class Player {
      constructor(x, y, color, controls) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.width = 40;
        this.height = 40;
        this.speed = 5;
        this.controls = controls;
        this.bullets = [];
        this.life = 5;
        this.score = 0;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        // Barra de vida
        ctx.fillStyle = "black";
        ctx.fillRect(this.x, this.y - 15, this.width, 5);
        ctx.fillStyle = "green";
        ctx.fillRect(this.x, this.y - 15, (this.width * this.life) / 5, 5);
      }

      move(keys) {
        if (keys[this.controls.up]) this.y -= this.speed;
        if (keys[this.controls.down]) this.y += this.speed;
        if (keys[this.controls.left]) this.x -= this.speed;
        if (keys[this.controls.right]) this.x += this.speed;
      }

      shoot() {
        this.bullets.push(new Bullet(this.x + this.width/2, this.y, this.color));
      }
    }

    class Bullet {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = 10;
        this.speed = -7;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }

      update() {
        this.y += this.speed;
      }
    }

    const keys = {};
    const controlsP1 = { up: "KeyW", down: "KeyS", left: "KeyA", right: "KeyD", shoot: "Space" };
    const controlsP2 = { up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight", shoot: "Enter" };

    const player1 = new Player(200, 550, "red", controlsP1);
    const player2 = new Player(600, 550, "blue", controlsP2);

    document.addEventListener("keydown", e => {
      keys[e.code] = true;
      if (!gameOver) {
        if (e.code === player1.controls.shoot) player1.shoot();
        if (e.code === player2.controls.shoot) player2.shoot();
      }
    });

    document.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    function checkCollision(player, bullets, opponent) {
      for (let b of bullets) {
        if (b.x < player.x + player.width &&
            b.x + b.size > player.x &&
            b.y < player.y + player.height &&
            b.y + b.size > player.y) {
          bullets.splice(bullets.indexOf(b), 1);
          player.life -= 1;
          opponent.score += 1;
          if (player.life <= 0) {
            gameOver = true;
            winner = opponent.color;
          }
        }
      }
    }

    function drawScore() {
      ctx.fillStyle = "black";
      ctx.font = "20px Arial";
      ctx.fillText("Jogador 1 (Vermelho): " + player1.score, 20, 30);
      ctx.fillText("Jogador 2 (Azul): " + player2.score, 550, 30);
    }

    function drawGameOver() {
      ctx.fillStyle = "black";
      ctx.font = "40px Arial";
      ctx.fillText("Fim de jogo!", 300, 250);
      ctx.fillText("Vencedor: " + winner.toUpperCase(), 250, 320);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        player1.move(keys);
        player2.move(keys);

        player1.draw();
        player2.draw();

        player1.bullets.forEach(b => { b.update(); b.draw(); });
        player2.bullets.forEach(b => { b.update(); b.draw(); });

        checkCollision(player1, player2.bullets, player2);
        checkCollision(player2, player1.bullets, player1);

        drawScore();
      } else {
        drawGameOver();
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>

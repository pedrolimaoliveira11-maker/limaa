<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estobogas</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
            display: block;
            margin: auto;
        }
        #menu {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🚀 Estobogas 🚀</h1>
    <div id="menu">
        <button onclick="startGame()">Start</button>
        <button onclick="showInstructions()">Instruções</button>
        <button onclick="showRanking()">Ranking</button>
        <div id="info"></div>
    </div>
    <canvas id="gameCanvas" width="600" height="400" style="display:none;"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let nave, tiros, inimigos, explosoes, powerups;
        let pontos, vidas, nivel;
        let tiroDuplo, escudo;
        let velocidadeInimigo, intervaloInimigos, spawnLoop;
        let melhorPontuacao = 0;

        // Sons
        const somTiro = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
        const somExplosao = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");
        const somGameOver = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_cowbell.ogg");
        const somPowerup = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

        function resetGame() {
            nave = { x: 300, y: 350, width: 40, height: 20 };
            tiros = [];
            inimigos = [];
            explosoes = [];
            powerups = [];
            pontos = 0;
            vidas = 3;
            nivel = 1;
            tiroDuplo = false;
            escudo = false;
            velocidadeInimigo = 2;
            intervaloInimigos = 2000;
        }

        function startGame() {
            document.getElementById("menu").style.display = "none";
            canvas.style.display = "block";
            resetGame();
            spawnLoop = setInterval(criarInimigo, intervaloInimigos);
            setInterval(criarPowerup, 10000);
            loop();
        }

        function showInstructions() {
            document.getElementById("info").innerHTML = `
                <p>🎮 Controles:</p>
                <p>← → para mover a nave</p>
                <p>Espaço para atirar</p>
                <p>⭐ Power-ups: Verde = Vida, Azul = Tiro Duplo, Roxo = Escudo</p>
            `;
        }

        function showRanking() {
            document.getElementById("info").innerHTML = `
                <p>🏆 Melhor pontuação: ${melhorPontuacao}</p>
            `;
        }

        // Criar inimigos
        function criarInimigo() {
            let x = Math.random() * (canvas.width - 30);
            inimigos.push({ x: x, y: 0, width: 30, height: 20 });
        }

        // Criar power-up
        function criarPowerup() {
            let tipos = ["vida", "tiroDuplo", "escudo"];
            let tipo = tipos[Math.floor(Math.random() * tipos.length)];
            let x = Math.random() * (canvas.width - 20);
            powerups.push({ x: x, y: 0, tipo: tipo });
        }

        // Desenhar nave
        function desenharNave() {
            ctx.fillStyle = escudo ? "cyan" : "lime";
            ctx.fillRect(nave.x, nave.y, nave.width, nave.height);
        }

        // Desenhar tiros
        function desenharTiros() {
            ctx.fillStyle = "yellow";
            tiros.forEach(t => ctx.fillRect(t.x, t.y, 5, 10));
        }

        // Desenhar inimigos
        function desenharInimigos() {
            ctx.fillStyle = "red";
            inimigos.forEach(i => ctx.fillRect(i.x, i.y, i.width, i.height));
        }

        // Desenhar explosões
        function desenharExplosoes() {
            explosoes.forEach((e, index) => {
                ctx.fillStyle = "orange";
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.raio, 0, Math.PI * 2);
                ctx.fill();
                e.raio += 2;
                if (e.raio > 30) explosoes.splice(index, 1);
            });
        }

        // Desenhar power-ups
        function desenharPowerups() {
            powerups.forEach(p => {
                ctx.fillStyle = p.tipo === "vida" ? "green" : p.tipo === "tiroDuplo" ? "blue" : "purple";
                ctx.fillRect(p.x, p.y, 20, 20);
            });
        }

        // Atualizar posições
        function atualizar() {
            tiros.forEach(t => t.y -= 5);
            inimigos.forEach(i => i.y += velocidadeInimigo);
            powerups.forEach(p => p.y += 2);

            // Colisão tiro vs inimigo
            tiros.forEach((t, ti) => {
                inimigos.forEach((i, ii) => {
                    if (t.x < i.x + i.width && t.x + 5 > i.x && t.y < i.y + i.height && t.y + 10 > i.y) {
                        inimigos.splice(ii, 1);
                        tiros.splice(ti, 1);
                        pontos += 10;
                        explosoes.push({ x: i.x + i.width/2, y: i.y + i.height/2, raio: 5 });
                        somExplosao.play();

                        if (pontos % 50 === 0) {
                            nivel++;
                            velocidadeInimigo += 0.5;
                            intervaloInimigos = Math.max(500, intervaloInimigos - 200);
                            clearInterval(spawnLoop);
                            spawnLoop = setInterval(criarInimigo, intervaloInimigos);
                        }
                    }
                });
            });

            // Colisão inimigo vs nave
            inimigos.forEach((i, ii) => {
                if (i.y > canvas.height - 30) {
                    inimigos.splice(ii, 1);
                    if (escudo) escudo = false;
                    else vidas--;
                }
            });

            // Colisão nave vs power-up
            powerups.forEach((p, pi) => {
                if (nave.x < p.x + 20 && nave.x + nave.width > p.x && nave.y < p.y + 20 && nave.y + nave.height > p.y) {
                    if (p.tipo === "vida") vidas++;
                    if (p.tipo === "tiroDuplo") {
                        tiroDuplo = true;
                        setTimeout(() => tiroDuplo = false, 8000);
                    }
                    if (p.tipo === "escudo") escudo = true;
                    powerups.splice(pi, 1);
                    somPowerup.play();
                }
            });
        }

        // Loop do jogo
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            desenharNave();
            desenharTiros();
            desenharInimigos();
            desenharExplosoes();
            desenharPowerups();
            atualizar();

            ctx.fillStyle = "white";
            ctx.fillText("Pontos: " + pontos, 10, 20);
            ctx.fillText("Vidas: " + vidas, 500, 20);
            ctx.fillText("Nível: " + nivel, 270, 20);

            if (vidas > 0) {
                requestAnimationFrame(loop);
            } else {
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER!", 220, 200);
                somGameOver.play();
                melhorPontuacao = Math.max(melhorPontuacao, pontos);
                setTimeout(() => {
                    canvas.style.display = "none";
                    document.getElementById("menu").style.display = "block";
                }, 3000);
